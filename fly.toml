# TradeQuery on Fly.io
# 无状态部署：SQLite 每次启动从种子数据重建，不挂 volume；
# 闲时自动停机（auto_stop），被访问时自动唤醒，demo 场景成本接近零。
app = "tradequery-bank-demo"
primary_region = "sin"  # 注：hkg 已被 Fly.io 下架，亚洲就近用新加坡

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
